              - heading "法令の遵守と社会規範の尊重" [level=3] [ref=e74]
              - list [ref=e75]:
                - listitem [ref=e76]: 国内外の法令、契約、社内ルールを遵守します。
                - listitem [ref=e77]: 社会の一員として、人と地域に対して誠実な姿勢で行動します。
                - listitem [ref=e78]: 約束を守り、公正で透明性のある企業活動を行います。
          - article [ref=e80]:
            - generic [ref=e81]: "02"
            - generic [ref=e82]:
              - heading "安全・品質を最優先する事業運営" [level=3] [ref=e83]
              - list [ref=e84]:
                - listitem [ref=e85]: 施工、設備導入、保守、運用の各段階で安全確認を徹底します。
                - listitem [ref=e86]: 蓄電池、水素、発電設備、データセンターなどの特性を理解し、品質と安全性を両立します。
                - listitem [ref=e87]: 協力会社とも安全情報を共有し、現場全体で事故防止に取り組みます。
          - article [ref=e89]:
            - generic [ref=e90]: "03"
            - generic [ref=e91]:
              - heading "公正な取引と信頼関係の構築" [level=3] [ref=e92]
              - list [ref=e93]:
                - listitem [ref=e94]: 取引先、協力会社、行政、地域関係者と健全で透明な関係を保ちます。
                - listitem [ref=e95]: 不当な利益供与、利益相反、優越的地位の濫用を行いません。
                - listitem [ref=e96]: 節度ある態度で業務にあたり、信頼されるパートナーであり続けます。
          - article [ref=e98]:
            - generic [ref=e99]: "04"
            - generic [ref=e100]:
              - heading "地域社会との対話と共生" [level=3] [ref=e101]
              - list [ref=e102]:
                - listitem [ref=e103]: 事業計画に関わる地域の声を丁寧に受け止めます。
                - listitem [ref=e104]: 景観、騒音、交通、安全、環境への影響に配慮し、説明責任を果たします。
                - listitem [ref=e105]: 地域の暮らしと産業に役立つインフラづくりを目指します。
          - article [ref=e107]:
            - generic [ref=e108]: "05"
            - generic [ref=e109]:
              - heading "環境保全と脱炭素への貢献" [level=3] [ref=e110]
              - list [ref=e111]:
                - listitem [ref=e112]: 再生可能エネルギー、蓄電池、水素、AIデータセンターを通じて脱炭素化に貢献します。
                - listitem [ref=e113]: 自然環境、生態系、資源利用への影響を把握し、環境負荷の低減に努めます。
                - listitem [ref=e114]: 環境に優しい世界を創るという理念を、日々の事業判断に反映します。
          - article [ref=e116]:
            - generic [ref=e117]: "06"
            - generic [ref=e118]:
              - heading "人権・多様性・健康への配慮" [level=3] [ref=e119]
              - list [ref=e120]:
                - listitem [ref=e121]: 従業員、取引先、地域の方々の人権と個性を尊重します。
                - listitem [ref=e122]: ハラスメントや差別を許さず、安心して意見を交わせる職場をつくります。
                - listitem [ref=e123]: 安全で健康に働ける環境づくりに継続して取り組みます。
          - article [ref=e125]:
            - generic [ref=e126]: "07"
            - generic [ref=e127]:
              - heading "情報と知的財産の適正管理" [level=3] [ref=e128]
              - list [ref=e129]:
                - listitem [ref=e130]: 個人情報、機密情報、事業資料、技術情報を適切に管理します。
                - listitem [ref=e131]: 知的財産権を尊重し、他者の権利を侵害しません。
                - listitem [ref=e132]: 情報を不正に取得、利用、開示せず、必要な範囲で正確に取り扱います。
          - article [ref=e134]:
            - generic [ref=e135]: "08"
            - generic [ref=e136]:
              - heading "反社会的勢力との関係遮断" [level=3] [ref=e137]
              - list [ref=e138]:
                - listitem [ref=e139]: 社会の秩序や安全に脅威を与える組織・団体とは一切関係を持ちません。
                - listitem [ref=e140]: 不当な要求には毅然と対応し、関係機関とも連携して対処します。
          - article [ref=e142]:
            - generic [ref=e143]: "09"
            - generic [ref=e144]:
              - heading "社内体制と教育の充実" [level=3] [ref=e145]
              - list [ref=e146]:
                - listitem [ref=e147]: 事業活動に必要な法規制、安全基準、社内ルールの理解を深めます。
                - listitem [ref=e148]: 社員教育、現場共有、ルールの見直しを通じて、企業倫理の実効性を高めます。
                - listitem [ref=e149]: 新しい事業領域に応じて、必要な知識と管理体制を更新します。
          - article [ref=e151]:
            - generic [ref=e152]: "10"
            - generic [ref=e153]:
              - heading "問題の早期発見と是正・再発防止" [level=3] [ref=e154]
              - list [ref=e155]:
                - listitem [ref=e156]: 行動基準に反するおそれのある事態を見つけた場合、速やかに共有します。
                - listitem [ref=e157]: 原因を確認し、是正措置と再発防止策を講じます。
                - listitem [ref=e158]: 失敗や課題を隠さず、よりよい事業運営につなげます。
