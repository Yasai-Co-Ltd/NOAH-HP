    - region "プライバシーポリシー" [ref=e10]:
      - generic [ref=e12]:
        - paragraph [ref=e13]: PRIVACY POLICY
        - heading "プライバシーポリシー" [level=1] [ref=e14]
        - paragraph [ref=e15]: 諾亜建設株式会社における個人情報の取り扱い方針を定めたものです。
      - text: PRIVACY
    - region "プライバシーポリシー本文" [ref=e16]:
      - generic [ref=e18]:
        - list [ref=e19]:
          - listitem [ref=e20]:
            - heading "01 基本方針" [level=2] [ref=e21]:
              - generic [ref=e22]: "01"
              - text: 基本方針
            - paragraph [ref=e23]: 諾亜建設株式会社（以下「当社」といいます。）は、エネルギー事業をはじめとする事業活動において、お客様、取引先、採用応募者など関係者の皆様の個人情報を取り扱います。当社は、個人情報の保護に関する法律その他の関係法令およびガイドラインを遵守し、個人情報を適切に取得・利用・管理することを社会的責務と認識し、本プライバシーポリシーを定めます。
          - listitem [ref=e24]:
            - heading "02 個人情報の定義" [level=2] [ref=e25]:
              - generic [ref=e26]: "02"
              - text: 個人情報の定義
            - paragraph [ref=e27]: 本ポリシーにおいて「個人情報」とは、生存する個人に関する情報であって、氏名、生年月日、住所、電話番号、メールアドレスその他の記述等により特定の個人を識別することができるもの、および他の情報と容易に照合することができ、それにより特定の個人を識別することができることとなるものをいいます。
          - listitem [ref=e28]:
            - heading "03 個人情報の取得" [level=2] [ref=e29]:
              - generic [ref=e30]: "03"
              - text: 個人情報の取得
            - paragraph [ref=e31]: 当社は、適法かつ公正な手段により個人情報を取得します。お問い合わせフォーム、採用応募フォーム、お電話・メール、お取引等を通じて、必要な範囲で個人情報をご提供いただく場合があります。
          - listitem [ref=e32]:
            - heading "04 利用目的" [level=2] [ref=e33]:
              - generic [ref=e34]: "04"
              - text: 利用目的
            - paragraph [ref=e35]: 当社は、取得した個人情報を以下の目的の範囲内で利用します。
            - list [ref=e36]:
              - listitem [ref=e37]: お問い合わせ・ご相談への対応およびご連絡のため
              - listitem [ref=e38]: 採用選考および採用に関するご連絡・手続きのため
              - listitem [ref=e39]: ご契約の履行、製品・サービスの提供、アフターサポートのため
              - listitem [ref=e40]: 取引先との連絡・調整および業務上必要な手続きのため
              - listitem [ref=e41]: 当社事業に関する情報やご案内の提供のため
              - listitem [ref=e42]: 上記利用目的に付随する業務の遂行のため
          - listitem [ref=e43]:
            - heading "05 第三者提供" [level=2] [ref=e44]:
              - generic [ref=e45]: "05"
              - text: 第三者提供
            - paragraph [ref=e46]: 当社は、次のいずれかに該当する場合を除き、あらかじめご本人の同意を得ることなく、個人情報を第三者に提供しません。
            - list [ref=e47]:
              - listitem [ref=e48]: 法令に基づく場合
              - listitem [ref=e49]: 人の生命、身体または財産の保護のために必要があり、ご本人の同意を得ることが困難な場合
              - listitem [ref=e50]: 公衆衛生の向上または児童の健全な育成の推進のために特に必要があり、ご本人の同意を得ることが困難な場合
              - listitem [ref=e51]: 国の機関等が法令の定める事務を遂行することに協力する必要があり、同意を得ることにより当該事務の遂行に支障を及ぼすおそれがある場合
          - listitem [ref=e52]:
            - heading "06 業務委託" [level=2] [ref=e53]:
              - generic [ref=e54]: "06"
              - text: 業務委託
            - paragraph [ref=e55]: 当社は、利用目的の達成に必要な範囲内で個人情報の取り扱いを外部に委託する場合があります。この場合、委託先について適切な調査を行い、必要かつ適切な監督を行います。
          - listitem [ref=e56]:
            - heading "07 安全管理措置" [level=2] [ref=e57]:
              - generic [ref=e58]: "07"
              - text: 安全管理措置
            - paragraph [ref=e59]: 当社は、個人情報の漏えい、滅失またはき損の防止その他の安全管理のために、必要かつ適切な措置を講じるとともに、個人情報を取り扱う従業者に対して適切な監督を行います。
          - listitem [ref=e60]:
            - heading "08 開示・訂正・利用停止等" [level=2] [ref=e61]:
              - generic [ref=e62]: "08"
              - text: 開示・訂正・利用停止等
            - paragraph [ref=e63]: ご本人から、個人情報の開示、訂正、追加、削除、利用停止または第三者提供の停止のご請求があった場合には、ご本人であることを確認のうえ、法令に従い、合理的な範囲で速やかに対応します。ご請求は、末尾のお問い合わせ窓口までご連絡ください。
          - listitem [ref=e64]:
            - heading "09 Cookie・アクセス解析" [level=2] [ref=e65]:
              - generic [ref=e66]: "09"
              - text: Cookie・アクセス解析
            - paragraph [ref=e67]: 当社ウェブサイトでは、利用状況の把握やサービス改善のためにCookieやアクセス解析ツールを利用する場合があります。これらにより取得される情報には、単独で特定の個人を識別できる情報は含まれません。ブラウザの設定によりCookieを無効化することができますが、その場合、一部の機能がご利用いただけないことがあります。
          - listitem [ref=e68]:
            - heading "10 本ポリシーの改定" [level=2] [ref=e69]:
              - generic [ref=e70]: "10"
              - text: 本ポリシーの改定
            - paragraph [ref=e71]: 当社は、法令の改正や事業内容の変更等に応じて、本プライバシーポリシーを改定することがあります。改定後の内容は、当社ウェブサイトに掲載した時点から効力を生じるものとします。
