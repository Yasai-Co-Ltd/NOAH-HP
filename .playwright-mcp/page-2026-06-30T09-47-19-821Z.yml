        - generic [ref=e50]:
          - paragraph [ref=e51]: 木質バイオマス燃料は、木材や枝葉などから作られる再生可能なエネルギー源です。 樹木の成長過程でCO2を吸収するため、燃焼時の排出と相殺するカーボンニュートラル燃料として位置づけられます。
          - paragraph [ref=e52]: NOAHは、燃料の調達量や価格だけではなく、認証、海上輸送、受入時の粉塵、 乾燥設備、生産ライン、長期契約まで含めて、発電事業者が継続運用しやすい供給・設備モデルを組み立てます。
