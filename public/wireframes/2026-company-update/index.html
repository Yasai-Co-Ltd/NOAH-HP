<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOAH 2026 Corporate Update Wireframes</title>
  <style>
    :root {
      --navy: #073c78;
      --deep: #062c57;
      --cyan: #28a9d6;
      --teal: #1d9895;
      --green: #4ca35d;
      --orange: #e7903c;
      --ink: #112844;
      --muted: #60758c;
      --line: #d8e3ed;
      --mist: #f2f7fa;
      --white: #fff;
      --max: 1240px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #dfe8ef; color: var(--ink); font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    body { padding: 40px 0; }
    .page { width: 1440px; margin: 0 auto 64px; background: #fff; overflow: hidden; box-shadow: 0 24px 64px rgba(15,45,73,.14); }
    .container { width: var(--max); margin: 0 auto; }
    .site-header { height: 92px; display: flex; align-items: center; border-bottom: 1px solid rgba(15,57,102,.12); background: rgba(255,255,255,.96); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 36px; }
    .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 17px; }
    .brand img { width: 52px; height: 52px; object-fit: contain; }
    .brand small { display:block; color: var(--muted); font-size: 10px; font-weight: 600; margin-top: 3px; }
    .nav { display: flex; align-items: center; gap: 30px; font-size: 14px; font-weight: 700; }
    .nav .contact { padding: 15px 22px; background: var(--navy); color: #fff; }
    .hero { position: relative; min-height: 620px; display: flex; align-items: flex-end; overflow: hidden; }
    .hero::after { content:""; position:absolute; inset:0; background: linear-gradient(90deg, rgba(2,31,65,.86) 0%, rgba(3,48,91,.55) 48%, rgba(3,30,57,.08) 82%); }
    .hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .hero-copy { position:relative; z-index:1; width:760px; padding: 112px 0 86px; color:#fff; }
    .eyebrow { display:flex; align-items:center; gap:14px; font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    .eyebrow::before { content:""; width:42px; height:2px; background: currentColor; opacity:.72; }
    h1 { margin:22px 0 22px; font-size:70px; line-height:1.16; letter-spacing:0; font-weight:700; }
    .hero-copy p { max-width:690px; margin:0; font-size:18px; line-height:2; }
    .hero-plain { min-height: 390px; align-items:center; background:#edf5f9; }
    .hero-plain::after { background:linear-gradient(90deg, rgba(255,255,255,.98), rgba(255,255,255,.68) 56%, rgba(255,255,255,.14)); }
    .hero-plain .hero-copy { color:var(--ink); padding:72px 0; }
    .hero-plain h1 { font-size:64px; }
    .hero-product { min-height:660px; }
    .hero-product::after { background:linear-gradient(90deg,rgba(4,30,57,.92),rgba(4,47,84,.64) 45%,rgba(4,31,58,.04) 82%); }
    .metric-strip { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--line); background:#fff; }
    .metric { min-height:142px; padding:30px 34px; border-right:1px solid var(--line); display:flex; flex-direction:column; justify-content:center; }
    .metric:last-child { border-right:0; }
    .metric b { color:var(--navy); font-size:36px; line-height:1.1; }
    .metric span { margin-top:10px; color:var(--muted); font-size:13px; line-height:1.6; }
    .band { padding:108px 0; }
    .band.mist { background:var(--mist); }
    .band.deep { background:var(--deep); color:#fff; }
    .band.green { background:#eef7ef; }
    .section-head { display:grid; grid-template-columns:minmax(0,.84fr) minmax(360px,.58fr); gap:100px; align-items:end; margin-bottom:52px; }
    .section-head h2 { margin:18px 0 0; font-size:46px; line-height:1.35; letter-spacing:0; }
    .section-head > p { color:var(--muted); font-size:16px; line-height:2; margin:0; }
    .deep .section-head > p { color:#c8d7e5; }
    .cards { display:grid; gap:20px; }
    .cards.five { grid-template-columns:repeat(5,1fr); }
    .cards.four { grid-template-columns:repeat(4,1fr); }
    .cards.three { grid-template-columns:repeat(3,1fr); }
    .card { background:#fff; border:1px solid var(--line); min-width:0; }
    .card-img { position:relative; aspect-ratio:1.28/1; overflow:hidden; background:#dbe8ef; }
    .card-img img { width:100%; height:100%; object-fit:cover; }
    .card-body { padding:24px 24px 26px; }
    .card-body small { color:var(--cyan); font-weight:800; font-size:11px; letter-spacing:.08em; }
    .card-body h3 { margin:12px 0 10px; font-size:20px; line-height:1.45; }
    .card-body p { margin:0; color:var(--muted); font-size:13px; line-height:1.8; }
    .feature-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .feature { padding:42px 38px; border-right:1px solid var(--line); }
    .feature:last-child { border-right:0; }
    .feature b { display:block; color:var(--cyan); font-size:13px; }
    .feature h3 { margin:16px 0 12px; font-size:25px; }
    .feature p { margin:0; color:var(--muted); line-height:1.85; font-size:14px; }
    .split { display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:70px; align-items:center; }
    .split.reverse { grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); }
    .media { position:relative; min-height:480px; overflow:hidden; background:#dbe8ef; }
    .media img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .copy h2 { margin:16px 0 22px; font-size:44px; line-height:1.4; }
    .copy p { color:var(--muted); font-size:16px; line-height:2; }
    .deep .copy p { color:#c8d7e5; }
    .bullet-list { display:grid; gap:0; border-top:1px solid var(--line); margin-top:30px; }
    .bullet-list div { display:grid; grid-template-columns:52px 1fr; gap:16px; padding:20px 0; border-bottom:1px solid var(--line); }
    .bullet-list b { color:var(--cyan); font-size:14px; }
    .bullet-list strong { display:block; font-size:18px; margin-bottom:5px; }
    .bullet-list span { color:var(--muted); font-size:13px; line-height:1.7; }
    .profile-table { border-top:2px solid var(--navy); }
    .profile-row { display:grid; grid-template-columns:230px 1fr; border-bottom:1px solid var(--line); }
    .profile-row dt, .profile-row dd { margin:0; padding:22px 26px; line-height:1.8; font-size:15px; }
    .profile-row dt { background:#f2f6f9; font-weight:700; }
    .domain-orbit { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; }
    .domain-orbit article { padding:28px 22px; min-height:160px; color:#fff; background:var(--navy); display:flex; flex-direction:column; justify-content:space-between; }
    .domain-orbit article:nth-child(2){background:#1e6ead}.domain-orbit article:nth-child(3){background:var(--teal)}.domain-orbit article:nth-child(4){background:#4d8f63}.domain-orbit article:nth-child(5){background:#165478}
    .domain-orbit small { opacity:.76; font-weight:700; }
    .domain-orbit h3 { margin:34px 0 0; font-size:20px; line-height:1.5; }
    .timeline { border-top:1px solid var(--line); }
    .timeline-row { display:grid; grid-template-columns:150px 1fr; border-bottom:1px solid var(--line); }
    .timeline-row time { padding:24px 0; color:var(--navy); font-size:28px; font-weight:800; }
    .timeline-row div { padding:26px 0; }
    .timeline-row h3 { margin:0 0 8px; font-size:19px; }
    .timeline-row p { margin:0; color:var(--muted); font-size:14px; line-height:1.8; }
    .timeline-row.latest { background:#eaf5f8; margin:0 -30px; padding:0 30px; }
    .routes { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-top:36px; }
    .route { min-height:118px; padding:24px 20px; border:1px solid rgba(255,255,255,.22); }
    .route b { color:#79d5ec; font-size:13px; }
    .route h3 { font-size:18px; line-height:1.5; margin:14px 0 0; }
    .subdomain { margin-top:22px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .subdomain article { padding:25px; background:#fff; border-left:4px solid var(--orange); }
    .subdomain h3 { margin:0 0 8px; font-size:18px; }
    .subdomain p { margin:0; color:var(--muted); font-size:13px; line-height:1.7; }
    .portfolio { display:grid; grid-template-columns:1.1fr .9fr; gap:26px; }
    .portfolio-main { min-height:490px; position:relative; overflow:hidden; background:#dce8ee; }
    .portfolio-main img { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
    .portfolio-main::after { content:""; position:absolute; inset:40% 0 0; background:linear-gradient(transparent,rgba(3,36,68,.9)); }
    .portfolio-caption { position:absolute; z-index:1; left:34px; right:34px; bottom:30px; color:#fff; }
    .portfolio-caption b { font-size:34px; }
    .portfolio-caption p { margin:10px 0 0; font-size:14px; line-height:1.7; }
    .portfolio-side { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .mini-photo { min-height:238px; position:relative; overflow:hidden; }
    .mini-photo img { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
    .mini-photo span { position:absolute; z-index:1; left:14px; bottom:14px; padding:8px 10px; background:#fff; font-weight:700; font-size:12px; }
    .system-grid { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); }
    .system-grid article { padding:30px; border-right:1px solid var(--line); min-height:185px; }
    .system-grid article:last-child { border-right:0; }
    .system-grid b { color:var(--teal); font-size:30px; }
    .system-grid h3 { margin:14px 0 10px; font-size:17px; }
    .system-grid p { margin:0; color:var(--muted); font-size:12px; line-height:1.7; }
    .certs { display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:28px 32px; background:#fff; border:1px solid var(--line); }
    .certs strong { margin-right:auto; color:var(--navy); }
    .cert { border:1px solid var(--line); padding:12px 18px; font-weight:800; color:var(--navy); font-size:13px; }
    .cert.logo { padding:8px 14px; }
    .cert.logo img { height:30px; width:auto; display:block; }
    .flow { display:grid; grid-template-columns:repeat(5,1fr); gap:0; }
    .flow article { padding:28px 24px; border-top:3px solid var(--cyan); border-right:1px solid var(--line); background:#fff; min-height:185px; }
    .flow article:last-child { border-right:0; }
    .flow b { color:var(--cyan); font-size:13px; }
    .flow h3 { margin:14px 0 9px; font-size:18px; line-height:1.5; }
    .flow p { margin:0; color:var(--muted); font-size:12px; line-height:1.7; }
    .project-table { width:100%; border-collapse:collapse; background:#fff; }
    .project-table th, .project-table td { padding:18px 20px; border-bottom:1px solid var(--line); text-align:left; font-size:13px; }
    .project-table thead th { background:var(--navy); color:#fff; }
    .project-table tbody th { color:var(--navy); }
    .area-list { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; }
    .area { display:grid; grid-template-columns:220px 1fr; min-height:190px; border:1px solid var(--line); background:#fff; }
    .area img { width:100%; height:100%; object-fit:cover; }
    .area div { padding:24px; }
    .area small { color:var(--cyan); font-weight:800; }
    .area h3 { margin:10px 0; font-size:18px; }
    .area p { margin:0; color:var(--muted); font-size:12px; line-height:1.7; }
    .cta { background:#0d4b83; color:#fff; padding:74px 0; }
    .cta-inner { display:flex; align-items:center; justify-content:space-between; gap:40px; }
    .cta h2 { margin:0; font-size:36px; }
    .cta p { margin:12px 0 0; color:#d5e5f1; }
    .button { display:inline-block; padding:18px 26px; background:#fff; color:var(--navy); font-weight:800; }
    .footer { background:#052b55; color:#fff; padding:48px 0; }
    .footer-inner { display:flex; justify-content:space-between; align-items:flex-end; }
    .footer small { color:#9db4ca; }
    .label { color:var(--cyan); font-weight:800; font-size:12px; letter-spacing:.12em; }
    .home .hero { min-height:700px; }
    .home .hero img { object-position:center 45%; }
    .about-hub .hero img { object-position:center 42%; }
    .battery .hero img { object-position:center 58%; }
    .biomass .hero img { object-position:center; }
    .hopper .hero img { object-position:center 44%; }
    .wind .hero img { object-position:center 48%; }
    .ai .hero img { object-position:center 48%; }
  </style>
</head>
<body>
  <div id="pages"></div>
  <script>
    const A = (path) => `../../assets/${path}`;
    const header = `
      <header class="site-header"><div class="container header-inner">
        <div class="brand"><img src="${A('noah_logo-mark.png')}" alt=""><div>諾亜建設株式会社<small>NOAH CONSTRUCTION CO., LTD.</small></div></div>
        <nav class="nav"><span>企業情報</span><span>事業紹介</span><span>サステナビリティ</span><span>ニュース</span><span>採用情報</span><span class="contact">お問い合わせ</span></nav>
      </div></header>`;
    const footer = `
      <section class="cta"><div class="container cta-inner"><div><h2>事業に関するご相談はこちら</h2><p>構想段階から、設備・開発・導入までご相談いただけます。</p></div><span class="button">お問い合わせ →</span></div></section>
      <footer class="footer"><div class="container footer-inner"><div class="brand"><img src="${A('noah_logo-mark.png')}" alt=""><div>諾亜建設株式会社<small>NOAH CONSTRUCTION CO., LTD.</small></div></div><small>Copyright © NOAH CONSTRUCTION CO., LTD.</small></div></footer>`;
    const hero = ({image, eyebrow, title, lead, plain=false, product=false}) => `
      <section class="hero ${plain?'hero-plain':''} ${product?'hero-product':''}"><img src="${A(image)}" alt=""><div class="container"><div class="hero-copy"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${lead}</p></div></div></section>`;
    const sectionHead = (eyebrow,title,lead='') => `<div class="section-head"><div><div class="label">${eyebrow}</div><h2>${title}</h2></div>${lead?`<p>${lead}</p>`:''}</div>`;
    const card = (img,small,title,text) => `<article class="card"><div class="card-img"><img src="${A(img)}" alt=""></div><div class="card-body"><small>${small}</small><h3>${title}</h3><p>${text}</p></div></article>`;
    const wrap = (id, klass, content) => `<article id="${id}" class="page ${klass}">${header}${content}${footer}</article>`;

    const home = wrap('01-home','home',`
      ${hero({image:'hero-wind-hq.jpg',eyebrow:'NOAH INTEGRATED INFRASTRUCTURE',title:'未来を拓く、<br>社会を支える。',lead:'発電、蓄電、風力、水素、AIデータセンター。エネルギーと次世代インフラを一体で構想し、持続可能な社会の実装を進めます。'})}
      <section class="band"><div class="container">${sectionHead('ABOUT NOAH','技術・統合・展開で、<br>新エネルギーを事業へ。','発電所設備の設計から調達・施工・試運転まで。燃料、電力制御、データ基盤を組み合わせ、構想を運用できるインフラへ変えていきます。')}<div class="feature-grid"><article class="feature"><b>ENGINEERING</b><h3>技術</h3><p>設計、機器選定、調達、製造、据付、試運転、O&Mまで一貫して対応。</p></article><article class="feature"><b>INTEGRATION</b><h3>統合</h3><p>発電設備、燃料、PKS、木質ペレット、蓄電・制御を横断して構成。</p></article><article class="feature"><b>DEVELOPMENT</b><h3>展開</h3><p>蓄電池、風力、AIデータセンターを中心に全国の開発を推進。</p></article></div></div></section>
      <section class="band mist"><div class="container">${sectionHead('OUR BUSINESS','5つの中核領域を、<br>ひとつの構想でつなぐ。','事業の入口を5領域に整理し、専門設備・燃料・周辺技術は各領域の中で分かりやすく案内します。')}<div class="cards five">${card('power-hq.jpg','POWER','発電事業','発電設備、燃料転換、バイオマス燃料、港湾荷役設備。')}${card('battery-hq.jpg','BATTERY','蓄電池事業','系統用蓄電池の開発、設備、制御、O&M。')}${card('hero-wind-hq.jpg','WIND','風力発電事業','導入、リプレース、長期保守、空中風力。')}${card('hydrogen-mobility/hero-fcv-truck.jpg','HYDROGEN','水素・新エネルギー自動車','水素設備、FCV、コンプレッサー。')}${card('ai-data-center/hero-data-center.jpg','AI DATA CENTER','AIデータセンター事業','電力、冷却、通信、蓄電池を統合した開発。')}</div></div></section>
      <section class="band"><div class="container"><div class="split"><div class="copy"><div class="label">NATIONWIDE DEVELOPMENT</div><h2>全国で進む、<br>蓄電池とAI基盤。</h2><p>開発規模を数字だけで並べず、蓄電池とAIデータセンターがどのように連携するかを一つのストーリーとして見せます。</p><div class="bullet-list"><div><b>01</b><span><strong>系統用蓄電池</strong>26案件・約1.2GW、九州を中心に全国展開。</span></div><div><b>02</b><span><strong>AIデータセンター</strong>全国10候補地・想定約1.2GW。</span></div><div><b>03</b><span><strong>統合開発</strong>用地、受電、再エネ、蓄電、運用を一体化。</span></div></div></div><div class="media"><img src="${A('strengths-bg-integrated-energy.png')}" alt=""></div></div></div></section>
    `);

    const about = wrap('02-about','about-hub',`
      ${hero({image:'about/hero-noah-brand-ai.png',eyebrow:'ABOUT NOAH',title:'信頼を積み重ね、<br>未来の基盤をつくる。',lead:'2018年の設立から、発電所設備と脱炭素領域で積み上げてきた技術と実績。NOAHの現在地を、会社情報と事業の両面から紹介します。',plain:true})}
      <section class="band"><div class="container"><div class="split reverse"><div class="media"><img src="${A('about-collage.png')}" alt=""></div><div class="copy"><div class="label">COMPANY AT A GLANCE</div><h2>新エネルギーを、<br>社会実装する会社。</h2><p>発電所設備の設計段階から機器選定、調達、施工、試運転までを一貫して提供。脱炭素を理念ではなく、運用できるインフラとして届けます。</p><div class="bullet-list"><div><b>2018</b><span><strong>設立</strong>東京都中野区を拠点に事業を展開。</span></div><div><b>99M</b><span><strong>資本金</strong>99,000,000円。</span></div><div><b>5</b><span><strong>中核事業</strong>発電・蓄電池・風力・水素・AI。</span></div></div></div></div></div></section>
      <section class="band mist"><div class="container">${sectionHead('COMPANY MENU','NOAHを知る、<br>7つのコンテンツ。','情報メニューは現行の7ページを維持し、写真・余白・色調で内容の違いが伝わる構成にします。')}<div class="cards four">${card('about/menu/message-v2.png','MESSAGE','トップメッセージ','信頼と安心を大切にする代表メッセージ。')}${card('about/menu/vision-v2.png','VISION','企業理念・ビジョン','人と地球に優しい持続可能な未来へ。')}${card('about/menu/standard-v2.png','STANDARD','行動基準','品質、安全、誠実さを支える判断基準。')}${card('about/menu/outline-v2.png','PROFILE','会社概要','所在地、代表者、事業内容、取引先。')}${card('about/menu/organization-v2.png','ORGANIZATION','グループ・組織図','グループ会社と事業体制。')}${card('about/menu/history-v2.png','HISTORY','沿革','2018年から2026年までの歩み。')}${card('about/menu/safety-health-v2.png','HEALTH','健康経営','人材と安全を支える職場づくり。')}<article class="card"><div class="card-body"><small>QUICK FACTS</small><h3>事業の現在地</h3><p>蓄電池26案件、AIデータセンター10候補地。最新の開発状況へ案内します。</p></div></article></div></div></section>
      <section class="band deep"><div class="container">${sectionHead('BUSINESS OVERVIEW','5つの中核事業。','会社案内の事業概要とコーポレートサイトの詳細ページを、同じ分類軸でつなぎます。')}<div class="routes"><article class="route"><b>01</b><h3>発電事業</h3></article><article class="route"><b>02</b><h3>蓄電池事業</h3></article><article class="route"><b>03</b><h3>風力発電事業</h3></article><article class="route"><b>04</b><h3>水素・新エネルギー自動車</h3></article><article class="route"><b>05</b><h3>AIデータセンター</h3></article></div></div></section>
    `);
